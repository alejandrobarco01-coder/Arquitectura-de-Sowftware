<div class="overflow-x-auto bg-white rounded-lg shadow">
  <table class="w-full text-sm text-left text-gray-500">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b">
      <tr>
        <th scope="col" class="px-6 py-3">Bandera</th>
        <th scope="col" class="px-6 py-3">Nombre</th>
        <th scope="col" class="px-6 py-3">Capital</th>
        <th scope="col" class="px-6 py-3">Región</th>
        <th scope="col" class="px-6 py-3">Población</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let country of countries" class="bg-white border-b hover:bg-gray-50 transition-colors">
        <td class="px-6 py-4">
          <img [src]="country.flags.svg" [alt]="country.flags.alt || 'Bandera'" class="w-10 h-6 object-cover rounded shadow-sm">
        </td>
        <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
          {{ country.name.common }}
        </td>
        <td class="px-6 py-4">
          {{ country.capital ? country.capital[0] : 'N/A' }}
        </td>
        <td class="px-6 py-4">
          {{ country.region }}
        </td>
        <td class="px-6 py-4">
          {{ country.population | number }}
        </td>
      </tr>
      <tr *ngIf="countries.length === 0">
        <td colspan="5" class="px-6 py-4 text-center text-gray-500">
          No hay países disponibles para mostrar.
        </td>
      </tr>
    </tbody>
  </table>
</div>
