<div class="p-6">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Directorio de Países</h1>
    <p class="text-gray-600 mt-2">Consulta la información de países usando la API pública RestCountries.</p>
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <p class="text-gray-500 text-lg">Cargando datos desde la API...</p>
  </div>

  <div *ngIf="!isLoading">
    <app-table-countries [countries]="countries"></app-table-countries>
  </div>
</div>
